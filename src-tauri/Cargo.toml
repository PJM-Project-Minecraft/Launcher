[package]
name = "project-minecraft-launcher"
version = "0.5.6"
edition = "2021"
build = "build.rs"

[dependencies]
base64 = "0.22"
directories = "6"
discord-rich-presence = "1.1"
# Системное хранилище токена. Бэкенды подключаются ТОЛЬКО фичами: без них крейт
# собирается в in-memory заглушку (mock), и сохранённая сессия не переживает перезапуск.
# Linux — Secret Service через zbus (чистый Rust, без линковки libdbus: бинарник
# остаётся самодостаточным), Windows — Credential Manager.
keyring = { version = "3", features = [
    "async-secret-service",
    "crypto-rust",
    "tokio",
    "windows-native",
] }
rayon = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls-webpki-roots", "gzip", "zstd"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
# Проверка подписи автообновления (публичный ключ вшивается при сборке).
ed25519-dalek = "2"
hex = "0.4"
tauri = { version = "2.11", features = [] }
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
zstd = "0.13"

# Компайл-тайм обфускация строк-литералов (XOR в бинарнике, деобфускация в рантайме):
# прячет пути эндпоинтов/протокол античита от `strings`/дизассемблера — единственный
# оставшийся путь реверса после того, как анти-MITM закрыл снифф трафика.
obfstr = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug"] }

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

# Релиз-профиль: максимальная стойкость к реверс-инжинирингу бинарника.
[profile.release]
strip = true        # убрать все символы (имена функций/отладку) — анти-RE
lto = "fat"         # агрессивный inline между крейтами: дизасм труднее читать
codegen-units = 1   # максимум оптимизаций/инлайна (ценой времени сборки)
opt-level = 3
