// Сборка мода P5 через ModDevGradle. ⚠️ Укажи ТОЧНУЮ версию NeoForge своего игрового
// сервера в gradle.properties (neoforge_version). Сборка: ./gradlew build → build/libs/*.jar.
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.+'
}

group = 'xyz.projectminecraft.anticheat'
version = project.findProperty('mod_version') ?: '0.1.0'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// -g:none: без отладочной инфы (имён локальных/номеров строк) — анти-RE, как у Java-агента.
// Безопасно для загрузки мода (не ломает NeoForge/рефлексию). Полное имя-манглинг —
// ProGuard (proguard-rules.pro), но только ПОСЛЕ game-теста чистого мода.
tasks.withType(JavaCompile).configureEach {
    options.debug = false
}

neoForge {
    version = project.findProperty('neoforge_version')

    // interpolate ${version} в neoforge.mods.toml
    validateAccessTransformers = true
    runs {
        // при желании: client/server run-конфиги для локального теста
    }
    mods {
        pjmac {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

// Подстановка версии в mods.toml.
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

// --- Раздельные артефакты клиент/сервер ---
// Один codebase, один modId "pjmac" → namespace сетевого канала совпадает. Каждый jar —
// копия обработанного moddev-jar'а, из которой вырезаны классы чужой стороны и её @Mod-точка
// входа (иначе два @Mod("pjmac") в одном рантайме). Клиентский jar (раздаётся игрокам) не
// содержит серверной логики: секрета, URL-ов /p5/*, верификации, опроса отзывов.
def serverOnly = [
    '**/P5ModServer*.class', '**/P5ServerHandler*.class',
    '**/P5RevokePoller*.class', '**/P5Config*.class',
]
def clientOnly = [
    '**/P5ModClient*.class', '**/P5ClientHandler*.class', '**/P5Crypto*.class',
]

tasks.register('clientJar', Jar) {
    dependsOn tasks.named('jar')
    archiveClassifier = 'client'
    from({ zipTree(tasks.named('jar').flatMap { it.archiveFile }) }) {
        exclude serverOnly
    }
}

tasks.register('serverJar', Jar) {
    dependsOn tasks.named('jar')
    archiveClassifier = 'server'
    from({ zipTree(tasks.named('jar').flatMap { it.archiveFile }) }) {
        exclude clientOnly
    }
}

tasks.named('build') { dependsOn 'clientJar', 'serverJar' }
