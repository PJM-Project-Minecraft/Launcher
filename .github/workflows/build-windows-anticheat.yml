# Ручная сборка нативного античита под Windows (anticheat.dll).
# Запуск: вкладка Actions → Build Windows Anticheat DLL → Run workflow,
# либо: gh workflow run build-windows-anticheat.yml
# Готовый anticheat.dll — в артефактах рана; его кладём на прод в backend/data/
# (scp), бэкенд раздаёт его лаунчерам, SHA сверяется по манифесту.
#
# Собираем КРОСС-КОМПИЛЯЦИЕЙ (mingw-w64) на ubuntu-latest, а не MSVC на windows-latest:
# зеркало репо на git.likonchik.xyz крутит Forgejo Actions, Windows-раннера там нет и
# джоб висел в очереди вечно. Скрипт тот же, что гоняет ci.yml, — anticheat-native/build-win.sh
# (mingw 13 из ubuntu 24.04; на 22.04 не линковался IID_IDXGIOutput1 из DXGI).
name: Build Windows Anticheat DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # JDK даёт jvmti.h/jni.h; win32/jni_md.h вендорный, build-win.sh берёт его из репо.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build (mingw-w64)
        run: ./anticheat-native/build-win.sh
      # upload-artifact от GitHub отказывается работать против не-github сервера
      # (GHESNotSupportedError) — берём форк Forgejo по полному URL.
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: anticheat-dll-windows-x64
          path: backend/data/anticheat.dll
          if-no-files-found: error
