name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./...

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # next build включает проверку типов; eslint в проекте не настроен.
      - run: npm run build

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher-slint
      - run: cargo check --locked
        working-directory: launcher-slint
      # Тесты лаунчера гоняем здесь же: в них лежат проверки безопасности (маркер версии
      # обновления, safe_join, сверка SHA артефактов до установки) — без них CI пропускал
      # регрессии, которые видны только в рантайме у игрока.
      - run: cargo test --locked
        working-directory: launcher-slint

  # Нативный JVMTI-агент собирается вне Go/Rust/Node, поэтому раньше CI его вообще не
  # компилировал: ошибка в C всплывала только при ручной сборке перед выкаткой.
  # Собираем оба таргета — Linux (.so, gcc) и Windows (.dll, кросс-компиляция mingw).
  anticheat-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Linux .so
        run: ./anticheat-native/build.sh
      - name: Windows .dll (кросс-компиляция)
        run: ./anticheat-native/build-win.sh
      # Java-агент ходит с нативкой в паре (общий файловый протокол) — проверяем и его.
      - name: Java-агент
        run: ./anticheat-agent/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: anticheat-agents-ci
          path: |
            backend/data/libanticheat.so
            backend/data/anticheat.dll
            backend/data/anticheat-agent.jar
          if-no-files-found: error
