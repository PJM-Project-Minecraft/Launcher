# Ручная сборка плеер-лаунчера под Windows (MSVC, кросс) и Linux с зашитым URL бэкенда
# и подписью автообновления. Один ран — оба бинарника, подписаны ОДНИМ ключом.
#
# Запуск: вкладка Actions → Build Launcher Release → Run workflow,
# либо: gh workflow run build-launcher.yml -f api_url=https://launcher.likonchik.xyz
#
# Зачем и Linux здесь: приватный ключ подписи живёт в секретах GitHub, а не на
# машине разработчика — собирать Linux-релиз локально нечем подписать, и он уходил бы
# в раздачу без проверки подписи (регрессия для Linux-игроков).
#
# ПОДПИСЬ АВТООБНОВЛЕНИЯ (два режима, выбери один):
#   1) Ключ в CI (удобно, но приватный ключ покидает релиз-бокс → живёт в секретах GitHub):
#      Settings → Secrets → Actions → LAUNCHER_SIGNING_KEY = hex-seed из `updatesign keygen`.
#      CI сам выведет публичный ключ, вшьёт его и подпишет бинарник. Артефакт: бинарь + signature.txt.
#   2) Ключ офлайн (безопаснее): Settings → Variables → Actions → LAUNCHER_UPDATE_PUBKEY =
#      публичный ключ (hex, не секрет). CI вшивает его, но НЕ подписывает; скачай бинарник
#      из артефакта и подпиши локально: `updatesign sign -key <ключ> <файл>`.
# Без ключа автообновления или ключа delivery manifest release-сборка запрещена.
name: Build Launcher Release

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Публичный URL бэкенда (зашивается в бинарник)'
        required: true
        default: 'https://launcher.likonchik.xyz'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            platform: windows-x64
            binary: project-minecraft-launcher.exe
            artifact_name: ProjectMinecraftLauncher.exe
            runner: cargo-xwin
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64
            binary: project-minecraft-launcher
            artifact_name: project-minecraft-launcher
            runner: cargo
    # Оба таргета собираются на Linux: зеркало репо на git.likonchik.xyz крутит Forgejo
    # Actions, Windows-раннера там нет и windows-джоб висел в очереди вечно.
    # Windows-лаунчер собирается MSVC-таргетом через cargo-xwin. Так Tauri
    # статически линкует WebView2Loader и автообновлению по-прежнему нужен один .exe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deps
        run: |
          sudo apt-get update
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          else
            sudo apt-get install -y clang-18 clang-tools-18 lld-18 llvm-18
            # cc-rs и MSVC-линковщик ищут неверсионированные имена. В Ubuntu
            # эти инструменты могут ставиться только с суффиксом версии.
            for tool in clang-cl lld-link llvm-lib llvm-rc; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                candidate="$(find /usr/bin /usr/lib/llvm-18/bin -maxdepth 1 -name "$tool-18" | head -1)"
                test -n "$candidate"
                sudo ln -s "$candidate" "/usr/local/bin/$tool"
              fi
            done
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build Tauri frontend
        run: npm ci && npm run build:web
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install cargo-xwin
        if: matrix.platform == 'windows-x64'
        run: cargo install cargo-xwin --locked --version 0.23.1

      # Определяем публичный ключ: из приватного (секрет) — приоритет и одна точка правды;
      # иначе из variables. Приватный ключ пишем в файл только на время рана (раннер эфемерный).
      - name: Resolve signing pubkey
        id: resolve
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.LAUNCHER_SIGNING_KEY }}
          PUBVAR: ${{ vars.LAUNCHER_UPDATE_PUBKEY }}
        run: |
          if [[ -n "$SIGNING_KEY" ]]; then
            printf '%s' "$SIGNING_KEY" > backend/ci-signing.key
            PUB="$(cd backend && go run ./cmd/updatesign pubkey -key ci-signing.key)"
            echo "have_key=1" >> "$GITHUB_OUTPUT"
            echo "pubkey=$PUB" >> "$GITHUB_OUTPUT"
            echo "Подпись в CI включена. pubkey=$PUB"
          elif [[ -n "$PUBVAR" ]]; then
            echo "have_key=0" >> "$GITHUB_OUTPUT"
            echo "pubkey=$PUBVAR" >> "$GITHUB_OUTPUT"
            echo "Секрета нет — вшиваю pubkey из variables, подпишешь бинарник локально. pubkey=$PUBVAR"
          else
            echo "Не задан LAUNCHER_SIGNING_KEY или LAUNCHER_UPDATE_PUBKEY." >&2
            exit 1
          fi

      - name: Validate delivery manifest pubkey
        shell: bash
        env:
          DELIVERY_MANIFEST_PUBKEY: ${{ vars.DELIVERY_MANIFEST_PUBKEY }}
        run: |
          if [[ ! "$DELIVERY_MANIFEST_PUBKEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "DELIVERY_MANIFEST_PUBKEY должен содержать 64 lowercase hex-символа." >&2
            exit 1
          fi

      - name: Build release
        env:
          LAUNCHER_DEFAULT_API_URL: ${{ inputs.api_url }}
          LAUNCHER_UPDATE_PUBKEY: ${{ steps.resolve.outputs.pubkey }}
          DELIVERY_MANIFEST_PUBKEY: ${{ vars.DELIVERY_MANIFEST_PUBKEY }}
        # Только Tauri CLI встраивает frontendDist вместо devUrl. Голый cargo build
        # оставляет WebView на 127.0.0.1:1420 и непригоден для player-релиза.
        run: npm run tauri -- build --no-bundle --runner ${{ matrix.runner }} --target ${{ matrix.target }}

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(awk -F '"' '/^version = / { print $2; exit }' src-tauri/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact_name }}"
          chmod +x "dist/${{ matrix.artifact_name }}" || true

      # Автообновление доставляет один .exe: внешние WebView2/VC++ DLL сделают его нерабочим.
      - name: Verify portable Windows executable
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          IMPORTS="$(objdump -p "dist/${{ matrix.artifact_name }}")"
          if grep -Eiq 'DLL Name: (WebView2Loader|VCRUNTIME|MSVCP)[^ ]*\.dll' <<<"$IMPORTS"; then
            echo "ОШИБКА: Windows-бинарник зависит от внешней DLL:" >&2
            grep -Ei 'DLL Name: (WebView2Loader|VCRUNTIME|MSVCP)[^ ]*\.dll' <<<"$IMPORTS" >&2
            exit 1
          fi
          echo "Windows-бинарник самодостаточен для однофайлового обновления ✓"

      # Страховка: публичный ключ реально попал в бинарник (иначе лаунчер не проверял бы подпись).
      - name: Verify pubkey embedded
        if: steps.resolve.outputs.pubkey != ''
        shell: bash
        run: |
          if grep -aq "${{ steps.resolve.outputs.pubkey }}" "dist/${{ matrix.artifact_name }}"; then
            echo "Публичный ключ вшит в бинарник ✓"
          else
            echo "ОШИБКА: публичный ключ не вшит в бинарник." >&2
            exit 1
          fi

      - name: Verify delivery manifest pubkey embedded
        shell: bash
        run: |
          if grep -aq "${{ vars.DELIVERY_MANIFEST_PUBKEY }}" "dist/${{ matrix.artifact_name }}"; then
            echo "Ключ delivery manifest вшит в бинарник ✓"
          else
            echo "ОШИБКА: ключ delivery manifest не вшит в бинарник." >&2
            exit 1
          fi

      # Маркер версии: лаунчер >= 0.4.4 требует, чтобы обновление объявляло заявленную
      # версию (иначе подписанный старый бинарник можно выдать за новый релиз).
      - name: Verify version marker
        shell: bash
        run: |
          if grep -aq "PMLVER=${{ steps.version.outputs.version }};" "dist/${{ matrix.artifact_name }}"; then
            echo "Маркер версии PMLVER=${{ steps.version.outputs.version }}; на месте ✓"
          else
            echo "ОШИБКА: в бинарнике нет маркера версии — лаунчеры 0.4.4+ отвергнут это обновление." >&2
            exit 1
          fi

      # Подпись в CI (только при наличии секретного ключа). Проверяем её тут же — как лаунчер.
      - name: Sign
        if: steps.resolve.outputs.have_key == '1'
        shell: bash
        run: |
          cd backend
          SIG="$(go run ./cmd/updatesign sign -key ci-signing.key "../dist/${{ matrix.artifact_name }}")"
          go run ./cmd/updatesign verify -pub "${{ steps.resolve.outputs.pubkey }}" -sig "$SIG" "../dist/${{ matrix.artifact_name }}"
          echo "$SIG" > ../dist/signature.txt
          echo "Подпись: $SIG"

      - name: Cleanup signing key
        if: always()
        shell: bash
        run: rm -f backend/ci-signing.key

      # Workflow запускается в GitHub Actions: полный Forgejo URL
      # GitHub парсит как несуществующий repo и падает ещё на Set up job.
      - uses: actions/upload-artifact@v4
        with:
          name: project-minecraft-launcher-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/signature.txt
          if-no-files-found: warn
